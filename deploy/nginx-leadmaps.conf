server {
    listen 80;
    server_name leads.yourdomain.com; # Ganti dengan domain atau IP VPS Anda

    client_max_body_size 10M;

    # Static assets (Served directly by Nginx for high performance)
    location /static/ {
        alias /var/www/leadmaps-bi/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy to FastAPI / Uvicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE support (if used)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
