<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login &mdash; LeadMaps BI</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Compiled Tailwind CSS with Cache Buster -->
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}?v=1.0.4">
</head>
<body class="min-h-screen font-sans text-slate-800 antialiased flex items-center justify-center p-4 sm:p-6 bg-slate-950 relative overflow-x-hidden selection:bg-blue-600 selection:text-white"
      style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #020617; margin: 0; padding: 1rem; box-sizing: border-box;">

  <!-- Ambient Glow Effects in Background -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute -top-32 -left-32 w-80 sm:w-96 h-80 sm:h-96 bg-blue-600/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-32 -right-32 w-80 sm:w-96 h-80 sm:h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg h-96 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
  </div>

  <!-- Centered Login Card Container (Constrained Max-Width for Mobile & Desktop) -->
  <div class="w-full relative z-10 mx-auto" 
       style="max-width: 420px; width: 100%; margin: auto; position: relative;">
    
    <!-- Login Card -->
    <div class="bg-white rounded-3xl shadow-2xl border border-slate-100 p-6 sm:p-8 backdrop-blur-sm"
         style="background-color: #ffffff; border-radius: 1.25rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45); border: 1px solid #f1f5f9; padding: 2rem; box-sizing: border-box;">
      
      <!-- Brand Logo & Header -->
      <div class="text-center mb-6" style="text-align: center; margin-bottom: 1.5rem;">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white shadow-xl shadow-blue-500/30 mb-3 ring-4 ring-blue-50"
             style="width: 3.5rem; height: 3.5rem; border-radius: 1rem; background: linear-gradient(135deg, #2563eb, #4f46e5); color: #ffffff; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);">
          <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 1.75rem; height: 1.75rem;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
          </svg>
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight"
            style="font-size: 1.625rem; font-weight: 800; color: #0f172a; margin: 0; line-height: 1.2;">LeadMaps BI</h1>
        <p class="text-xs text-slate-500 font-medium mt-1"
           style="font-size: 0.75rem; color: #64748b; margin-top: 0.25rem;">Market Intelligence & Lead Generation</p>
      </div>

      <div class="mb-5 pb-3 border-b border-slate-100 text-center sm:text-left" style="margin-bottom: 1.25rem; padding-bottom: 0.75rem; border-bottom: 1px solid #f1f5f9;">
        <h2 class="text-sm font-bold text-slate-900" style="font-size: 0.875rem; font-weight: 700; color: #0f172a; margin: 0;">Masuk ke Sistem</h2>
        <p class="text-xs text-slate-500 mt-0.5" style="font-size: 0.75rem; color: #64748b; margin-top: 0.125rem;">Akses panel dashboard, scraping leads, dan admin API.</p>
      </div>

      {% if error_message %}
      <div class="mb-4 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-xs flex items-start space-x-2.5 animate-fade-in"
           style="background-color: #fff1f2; border: 1px solid #fecdd3; color: #9f1239; border-radius: 0.75rem; padding: 0.75rem 1rem; margin-bottom: 1rem; display: flex; align-items: flex-start; gap: 0.625rem;">
        <svg class="w-4 h-4 text-rose-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 1rem; height: 1rem; flex-shrink: 0;">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
        <div class="leading-relaxed font-semibold text-xs" style="font-size: 0.75rem;">{{ error_message }}</div>
      </div>
      {% endif %}

      {% if request.query_params.get('logged_out') %}
      <div class="mb-4 p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs flex items-center space-x-2.5 font-semibold"
           style="background-color: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; border-radius: 0.75rem; padding: 0.75rem 1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.625rem;">
        <svg class="w-4 h-4 text-emerald-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 1rem; height: 1rem; flex-shrink: 0;">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <div style="font-size: 0.75rem;">Anda telah berhasil keluar dari sistem.</div>
      </div>
      {% endif %}

      <form action="/login" method="POST" class="space-y-4" style="display: flex; flex-direction: column; gap: 1rem;">
        <input type="hidden" name="next" value="{{ next }}">

        <!-- Username Input -->
        <div>
          <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5"
                 style="display: block; font-size: 0.75rem; font-weight: 700; color: #334155; margin-bottom: 0.375rem;">
            Nama Pengguna / Username
          </label>
          <div class="relative" style="position: relative;">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"
                 style="position: absolute; top: 0; bottom: 0; left: 0; padding-left: 0.875rem; display: flex; align-items: center; pointer-events: none; color: #94a3b8;">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 1rem; height: 1rem;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </div>
            <input type="text"
                   id="username"
                   name="username"
                   required
                   autofocus
                   value="{{ username or '' }}"
                   placeholder="Masukkan username Anda"
                   class="w-full text-sm bg-slate-50 hover:bg-slate-100/60 focus:bg-white border border-slate-300 rounded-xl pl-10 pr-3.5 py-2.5 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 focus:outline-none transition shadow-xs"
                   style="width: 100%; font-size: 0.875rem; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 0.75rem; padding: 0.625rem 0.875rem 0.625rem 2.5rem; color: #0f172a; box-sizing: border-box; outline: none;">
          </div>
        </div>

        <!-- Password Input -->
        <div>
          <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5"
                 style="display: block; font-size: 0.75rem; font-weight: 700; color: #334155; margin-bottom: 0.375rem;">
            Kata Sandi / Password
          </label>
          <div class="relative" style="position: relative;">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"
                 style="position: absolute; top: 0; bottom: 0; left: 0; padding-left: 0.875rem; display: flex; align-items: center; pointer-events: none; color: #94a3b8;">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 1rem; height: 1rem;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </div>
            <input type="password"
                   id="password"
                   name="password"
                   required
                   placeholder="••••••••"
                   class="w-full text-sm bg-slate-50 hover:bg-slate-100/60 focus:bg-white border border-slate-300 rounded-xl pl-10 pr-11 py-2.5 text-slate-900 placeholder:text-slate-400 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 focus:outline-none transition shadow-xs"
                   style="width: 100%; font-size: 0.875rem; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 0.75rem; padding: 0.625rem 2.75rem 0.625rem 2.5rem; color: #0f172a; box-sizing: border-box; outline: none;">
            <button type="button" 
                    onclick="togglePasswordVisibility()" 
                    class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-700 focus:outline-none transition"
                    style="position: absolute; top: 0; bottom: 0; right: 0; padding-right: 0.875rem; display: flex; align-items: center; background: transparent; border: none; cursor: pointer; color: #94a3b8;"
                    aria-label="Lihat kata sandi">
              <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 1.125rem; height: 1.125rem;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-2" style="padding-top: 0.5rem;">
          <button type="submit"
                  class="w-full flex items-center justify-center space-x-2 py-3 px-4 rounded-xl bg-gradient-to-r from-blue-600 via-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white text-sm font-bold shadow-lg shadow-blue-600/30 active:scale-[0.99] transition duration-150 focus:ring-2 focus:ring-offset-2 focus:ring-blue-600 focus:outline-none cursor-pointer border-none"
                  style="width: 100%; padding: 0.75rem 1rem; border-radius: 0.75rem; background: linear-gradient(135deg, #2563eb, #4f46e5); color: #ffffff; font-weight: 700; font-size: 0.875rem; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.35);">
            <span>Masuk ke Dashboard</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 1rem; height: 1rem;">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
          </button>
        </div>
      </form>

    </div>

  </div>

  <script>
    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      if (pwd.type === 'password') {
        pwd.type = 'text';
      } else {
        pwd.type = 'password';
      }
    }
  </script>

</body>
</html>
