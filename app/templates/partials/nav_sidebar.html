<!-- Fixed Sidebar Navigation (Width 240px / w-60) with Mobile Drawer Support -->
<aside id="app-sidebar" class="w-60 bg-sidebar text-slate-300 flex flex-col fixed inset-y-0 left-0 z-30 shadow-xl select-none transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">
  
  <!-- Brand Header -->
  <div class="h-16 flex items-center justify-between px-5 border-b border-slate-800">
    <div class="flex items-center space-x-3 overflow-hidden">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-sm shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
        </svg>
      </div>
      <div class="overflow-hidden">
        <div class="font-bold text-white text-sm tracking-tight leading-tight">LeadMaps BI</div>
        <div class="text-[10px] text-slate-400 font-normal truncate">Market Intelligence System</div>
      </div>
    </div>

    <!-- Mobile Close Button -->
    <button type="button" onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white p-1 focus:outline-none" aria-label="Tutup Menu">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Navigation Groups -->
  <div class="flex-1 overflow-y-auto py-5 px-3 space-y-6">
    <!-- Group 1: NAVIGASI UTAMA -->
    <div>
      <div class="px-3 text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-2">
        NAVIGASI UTAMA
      </div>
      <nav class="space-y-1">
        <a href="/" 
           class="flex items-center px-3 py-2 text-xs rounded-lg transition-colors {% if active_page == 'dashboard' %}bg-sidebarActive text-white font-semibold{% else %}text-slate-300 hover:bg-sidebarActive hover:text-white{% endif %}">
          <svg class="w-4 h-4 mr-2.5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
          </svg>
          <span>Dashboard Ringkasan</span>
        </a>

        <a href="/leads" 
           class="flex items-center px-3 py-2 text-xs rounded-lg transition-colors {% if active_page == 'leads' %}bg-sidebarActive text-white font-semibold{% else %}text-slate-300 hover:bg-sidebarActive hover:text-white{% endif %}">
          <svg class="w-4 h-4 mr-2.5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
          </svg>
          <span>Peta & Analisis Leads</span>
        </a>

        <a href="/history" 
           class="flex items-center px-3 py-2 text-xs rounded-lg transition-colors {% if active_page == 'history' %}bg-sidebarActive text-white font-semibold{% else %}text-slate-300 hover:bg-sidebarActive hover:text-white{% endif %}">
          <svg class="w-4 h-4 mr-2.5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span>Riwayat Crawling</span>
        </a>

        <a href="/guide" 
           class="flex items-center px-3 py-2 text-xs rounded-lg transition-colors {% if active_page == 'guide' %}bg-sidebarActive text-white font-semibold{% else %}text-slate-300 hover:bg-sidebarActive hover:text-white{% endif %}">
          <svg class="w-4 h-4 mr-2.5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
          <span>Metodologi & Panduan</span>
        </a>
      </nav>
    </div>

    <!-- Group 2: KONFIGURASI -->
    <div>
      <div class="px-3 text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-2">
        KONFIGURASI
      </div>
      <nav class="space-y-1">
        <a href="/settings/profile" 
           class="flex items-center px-3 py-2 text-xs rounded-lg transition-colors {% if active_page == 'profile' %}bg-sidebarActive text-white font-semibold{% else %}text-slate-300 hover:bg-sidebarActive hover:text-white{% endif %}">
          <svg class="w-4 h-4 mr-2.5 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>

      </nav>
    </div>
  </div>

  <!-- Sidebar Footer -->
  <div class="p-4 border-t border-slate-800 bg-[#070A11] flex items-center justify-between text-xs">
    <div class="flex items-center space-x-2">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span class="text-slate-300 font-medium text-[11px]">Sistem Online</span>
    </div>
    <span class="text-[10px] text-slate-400 font-mono">v1.0</span>
  </div>
</aside>
